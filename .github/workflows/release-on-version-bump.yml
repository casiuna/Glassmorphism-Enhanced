name: Release On Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect theme version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-metadata.mjs detect >> "$GITHUB_OUTPUT"

      - name: Test dynamic release metadata policy
        run: node --test tests/release/*.test.mjs

      - name: Prepare version-specific Release Notes
        id: notes
        if: steps.version.outputs.version_changed == 'true' || steps.version.outputs.notes_changed == 'true'
        run: node scripts/release-metadata.mjs prepare >> "$GITHUB_OUTPUT"

      - name: Update existing release metadata only
        if: steps.version.outputs.version_changed != 'true' && steps.version.outputs.notes_changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { releaseMetadata, updateExistingRelease } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release-metadata.mjs')
            const result = await updateExistingRelease({ github, ...context.repo, metadata: releaseMetadata(process.env.GITHUB_WORKSPACE) })
            core.notice(JSON.stringify(result))

      - name: Skip unchanged version
        if: steps.version.outputs.version_changed != 'true'
        run: echo "Theme version unchanged; tag creation, release builds and asset publication are skipped."

      - name: Check release tag state
        id: tag
        if: steps.version.outputs.version_changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags

          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=${tag_sha}" >> "$GITHUB_OUTPUT"
            if [ "${tag_sha}" = "${CURRENT_SHA}" ]; then
              echo "current=true" >> "$GITHUB_OUTPUT"
            else
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::error::Tag ${RELEASE_TAG} already exists on ${tag_sha}, not on ${CURRENT_SHA}. Refusing to continue."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build project
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: bun run build

      - name: Validate stable source and module safety
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: |
          bun x --no-install eslint . --max-warnings 0
          bun x --no-install playwright test -c tests/request-manager.config.ts
          node --test tests/companion/protocol.test.cjs tests/full/protocol-management.test.cjs
          python3 tests/companion/test_helper.py

      - name: Build stable Full archive
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: python3 scripts/package-full.py

      - name: Verify stable archives and installer
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: |
          mkdir -p test-results/full
          python3 tests/full/test_distribution.py
          python3 tests/full/test_transport.py
          python3 tests/full/verify_delivery.py --packages-only

      - name: Create and push release tag
        if: steps.version.outputs.version_changed == 'true' && steps.tag.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create or update GitHub release
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            komari-theme-Glassmorphism-build*.zip
            test-results/release/Glassmorphism-Enhanced-Full-*.tar.gz
