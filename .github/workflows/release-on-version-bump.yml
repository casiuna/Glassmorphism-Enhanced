name: Release On Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect theme version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')

          const zeroSha = '0000000000000000000000000000000000000000'
          const beforeSha = process.env.BEFORE_SHA
          const versionRe = /^\d+\.\d+\.\d+(?:[-+][0-9A-Z.-]+)?$/i

          function readJson(filePath) {
            return JSON.parse(readFileSync(filePath, 'utf8'))
          }

          function readJsonAtRevision(revision, filePath) {
            const content = execFileSync('git', ['show', `${revision}:${filePath}`], { encoding: 'utf8' })
            return JSON.parse(content)
          }

          const themeJson = readJson('komari-theme.json')
          const currentVersion = themeJson.version

          if (typeof currentVersion !== 'string' || !versionRe.test(currentVersion)) {
            console.error(`Invalid komari-theme.json version: ${currentVersion}`)
            process.exit(1)
          }

          let previousVersion = ''
          let versionChanged = true

          if (beforeSha && beforeSha !== zeroSha) {
            try {
              previousVersion = readJsonAtRevision(beforeSha, 'komari-theme.json').version ?? ''
              versionChanged = previousVersion !== currentVersion
            }
            catch {
              versionChanged = true
            }
          }

          console.log(`current_version=${currentVersion}`)
          console.log(`previous_version=${previousVersion}`)
          console.log(`version_changed=${versionChanged}`)
          console.log(`release_tag=v${currentVersion}`)
          NODE

      - name: Skip unchanged version
        if: steps.version.outputs.version_changed != 'true'
        run: echo "Theme version unchanged; leaving existing tags and Release assets untouched."

      - name: Check release tag state
        id: tag
        if: steps.version.outputs.version_changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags

          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=${tag_sha}" >> "$GITHUB_OUTPUT"
            if [ "${tag_sha}" = "${CURRENT_SHA}" ]; then
              echo "current=true" >> "$GITHUB_OUTPUT"
            else
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::error::Tag ${RELEASE_TAG} already exists on ${tag_sha}, not on ${CURRENT_SHA}. Refusing to continue."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build project
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: bun run build

      - name: Validate stable source and module safety
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: |
          bun x --no-install eslint . --max-warnings 0
          bun x --no-install playwright test -c tests/request-manager.config.ts
          node --test tests/companion/protocol.test.cjs tests/full/protocol-management.test.cjs
          python3 tests/companion/test_helper.py

      - name: Build stable Full archive
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: python3 scripts/package-full.py

      - name: Verify stable archives and installer
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        run: |
          mkdir -p test-results/full
          python3 tests/full/test_distribution.py
          python3 tests/full/test_transport.py
          python3 tests/full/verify_delivery.py --packages-only

      - name: Create and push release tag
        if: steps.version.outputs.version_changed == 'true' && steps.tag.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create or update GitHub release
        if: steps.version.outputs.version_changed == 'true' && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Glassmorphism Enhanced ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Glassmorphism Enhanced v1.2.1

            - 节点线路摘要保持已验收的严格三等分：红／蓝／绿圆点与完整名称组内居中，不省略、不添加运营商前缀。
            - 后台统一为 01–05 五个分类。线路显示、自动结果消费、有效期、手动线路与 Ping／Transit 同归「03 · 线路与延迟」；外观与背景独立，可选采集诊断默认折叠。
            - 手动线路支持节点选择及联通／电信／移动三个输入框，与高级 JSON 共用原有主题配置。无需 Plugin、Helper 或 Agent 远程执行；保留管理员校验、配置读回与冲突检查。
            - 新增逐节点独立流量重置日与保守的历史覆盖判断，保留累计计数、Ping、Transit、价格和历史数据；不在前台增加重置倒计时。
            - 修复 Full 升级对新增 Plugin 默认配置项的误判，保留版本保护、真实加载故障补偿回滚和并发修改拒绝。

            **下载与安装**
            - `komari-theme-Glassmorphism-build-*.zip`：Komari 原生主题包，上传至主题管理器。
            - `Glassmorphism-Enhanced-Full-*.tar.gz`：一体化安装、升级与回滚包，包含已校验的内层 Full ZIP、安装器及 Theme / Plugin / Helper。不能直接上传至主题管理器。

            **自动探测限制**：手动显示零额外依赖。Plugin／Helper 仅是默认关闭的可选实验链路；Plugin 每个 Komari 服务端一次，Helper 仅供明确授权参与探测的来源节点使用，不要求所有 VPS 安装。原生 Agent 替代 Helper 仅完成审计，本版没有远程执行桥接或静默安装。实时 Helper → Plugin → 可靠 ASN／商业线路分类的公网生产闭环尚未完成验收，不承诺生产自动探测或可靠识别 CN2、9929、CMI 等线路。历史探测与 fixture／replay 不等于生产验证。

            实测隔离集成目标：Komari 1.6.0。Theme／Full：1.2.1；Plugin／Helper：0.3.0 加同一源码 commit 构建后缀。只有本 Release 的正式附件用于发行，不使用 DEVELOPMENT_ONLY 候选包。

            [完整发行说明](https://github.com/casiuna/Glassmorphism-Enhanced/blob/${{ github.sha }}/docs/release-notes-v1.2.1.md) · [部署、升级和回滚](https://github.com/casiuna/Glassmorphism-Enhanced/blob/${{ github.sha }}/docs/full.md) · [依赖审计](https://github.com/casiuna/Glassmorphism-Enhanced/blob/${{ github.sha }}/docs/settings-companion-audit.md)
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            komari-theme-Glassmorphism-build*.zip
            test-results/release/Glassmorphism-Enhanced-Full-*.tar.gz
